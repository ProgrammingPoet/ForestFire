<!DOCTYPE html>
<html>
<head>
    <title>Forest Fire</title>
    <style>
        body {
            margin: 0;
        }

    </style>
</head>
    
<body>
    <canvas class="Canvas" onclick="AddFire(event)"></canvas>

    <script>
        
        let Canvas = document.querySelector('.Canvas');
        Canvas.width = window.innerWidth;
        Canvas.height = window.innerHeight;
        let ctx = Canvas.getContext("2d");

        let Scale = 2
        let Width = Math.floor(Canvas.width / Scale)
        let Height = Math.floor(Canvas.height / Scale)




        let Screen = []

        for (let y = 0; y < Height; y++) {
            let Row = []
            for (let x = 0; x < Width; x++) {
                Row.push(0)
            }
            Screen.push(Row)
        }  
        
        // 0 = Alive          1 = Burning         2 = Dead        3 = Lightning

        // Main Loop

        function AddFire(event) {
            let x = Math.floor(event.clientX / Scale);
            let y = Math.floor(event.clientY / Scale);
            Screen[y][x] = 3;

        }
        
        
        function loop() {

            Canvas.addEventListener('click', function(event) {
                console.log(event.clientX, event.clientY); // gives you click coordinates
            });


            for (let y = 0; y < Height; y++) {
                for (let x = 0; x < Width; x++) {
                    if (Screen[y][x] == 1) {
                        
                        if (Math.random() < 0.1) Screen[y][x] = 2;

                        if (x > 0 && Math.random() < 0.2 && Screen[y][x-1] == 0) Screen[y][x-1] = 1;                  
                        if (x < Width-1 && Math.random() < 0.2 && Screen[y][x+1] == 0) Screen[y][x+1] = 1;     
                        if (y > 0 && Math.random() < 0.2 && Screen[y-1][x] == 0) Screen[y-1][x] = 1;                  
                        if (y < Height-1 && Math.random() < 0.2 && Screen[y+1][x] == 0) Screen[y+1][x] = 1; 

                    } else if (Screen[y][x] == 3) {
                        Screen[y][x] = 1;
                    } else if (Math.random() < 0.0000001 && Screen[y][x] == 0) {
                        Screen[y][x] = 3

                    } else if (Math.random() < 0.0025 && Screen[y][x] == 2) {
                        Screen[y][x] = 0
                    }

            }
        }
            

            for (let y = 0; y < Height; y++) {
                for (let x = 0; x < Width; x++) {
                    
                    
                    if (Screen[y][x] == 0) {
                            ctx.fillStyle = "green";
                            ctx.fillRect(x * Scale, y * Scale, Scale, Scale);
                    } else if (Screen[y][x] == 1) {
                        if (Math.random() < 0.7) {
                            ctx.fillStyle = "red";
                        } else {
                            ctx.fillStyle = "orange"
                        }
                        ctx.fillRect(x * Scale, y * Scale, Scale, Scale);
                    } else if (Screen[y][x] == 2) {
                        ctx.fillStyle = "rgb(50,50,50)";
                        ctx.fillRect(x * Scale, y * Scale, Scale, Scale);
                    } else if (Screen[y][x] == 3) {
                        ctx.fillStyle = "blue";
                        ctx.fillRect(x * Scale, y * Scale, Scale, Scale);
                    }

                }
            }  






            requestAnimationFrame(loop);
        }

        loop();




    </script>
</body>
</html>
